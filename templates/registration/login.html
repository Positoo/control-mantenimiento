<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Control Mantenimiento</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #1e1e1e;
            color: #e5e5e5;
            min-height: 100vh;
        }

        .login-container {
            min-height: 100vh;
        }

        .login-card {
            background-color: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            max-width: 420px;
            width: 100%;
        }

        .login-title {
            color: #ffffff;
        }

        .login-subtitle {
            color: #888;
        }

        .form-label {
            color: #bdbdbd;
        }

        .form-control {
            background-color: #242424;
            color: #ffffff;
            border-color: #444;
        }

        .form-control:focus {
            background-color: #242424;
            color: #ffffff;
            border-color: #666;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #777;
        }
    </style>
</head>

<body>

<div class="container login-container d-flex align-items-center justify-content-center">

    <div class="login-card p-4 shadow">

        <div class="text-center mb-4">

            <h2 class="login-title mb-2">
                Control Mantenimiento
            </h2>

            <p class="login-subtitle mb-0">
                Iniciar sesión
            </p>

        </div>


        {% if form.errors %}

            <div class="alert alert-danger">
                Usuario o contraseña incorrectos.
            </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}

            <div class="mb-3">

                <label for="id_username" class="form-label">
                    Usuario
                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    class="form-control"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>


            <div class="mb-4">

                <label for="id_password" class="form-label">
                    Contraseña
                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    class="form-control"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                Iniciar sesión
            </button>

        </form>

    </div>

</div>

</body>
</html>
